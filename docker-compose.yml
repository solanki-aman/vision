services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vision
      POSTGRES_PASSWORD: vision
      POSTGRES_DB: vision
    ports:
      - "5433:5432"  # host 5433 to avoid clashing with a local postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vision"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://vision:vision@postgres:5432/vision
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4.5}
      PORT: 3001
      SHOOTER_URL: http://shooter:3002
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server/app:/app/app

  shooter:
    build: ./shooter
    environment:
      WEB_URL: http://web:5173
    ports:
      - "3002:3002"
    depends_on:
      - web

  web:
    build: ./web
    environment:
      VITE_API_PROXY: http://server:3001
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html

volumes:
  pgdata:
