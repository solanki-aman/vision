services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vision
      POSTGRES_PASSWORD: vision
      POSTGRES_DB: vision
    ports:
      - "5433:5432"  # host 5433 to avoid clashing with a local postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vision"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vision
      MINIO_ROOT_PASSWORD: vision-secret
    ports:
      - "9000:9000"
      - "9001:9001"  # console, for looking at what got stored
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://vision:vision@postgres:5432/vision
      # Document bytes and page renders. Never exposed as presigned URLs — every
      # read goes through an endpoint that has resolved the caller's grant first.
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: vision
      MINIO_SECRET_KEY: vision-secret
      MINIO_BUCKET: documents
      DOC_IMAGE_BUDGET: ${DOC_IMAGE_BUDGET:-}
      DOC_PAGE_DPI: ${DOC_PAGE_DPI:-}
      DOC_SHEET_DPI: ${DOC_SHEET_DPI:-}
      DOC_READ_DPI: ${DOC_READ_DPI:-}
      # AUTH_MODE=oidc|disabled. Unset derives it from OIDC_ISSUER, which is how a
      # laptop runs it — as a single local principal, and an open document store the
      # moment the port is reachable. AUTH_MODE=oidc without a configured issuer
      # refuses to start rather than serving unauthenticated.
      AUTH_MODE: ${AUTH_MODE:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_POST_LOGOUT_URL: ${OIDC_POST_LOGOUT_URL:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4.5}
      XAI_REASONING_EFFORT: ${XAI_REASONING_EFFORT:-low}
      XAI_SEARCH_MODEL: ${XAI_SEARCH_MODEL:-}
      # LangSmith reads these itself; unset LANGSMITH_TRACING to turn tracing off.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-vision}
      PORT: 3001
      SHOOTER_URL: http://shooter:3002
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./server/app:/app/app
      # Mounted so `docker compose exec server pytest` runs the tests in the
      # same environment the service itself runs in.
      - ./server/tests:/app/tests
      - ./server/pytest.ini:/app/pytest.ini

  # The ambient worker: the only process that makes an ambient model call. Same image
  # as the server, different entrypoint, no HTTP port. Kill switch is a stopped
  # container; ambient cost is attributable to this one process.
  worker:
    build: ./server
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgres://vision:vision@postgres:5432/vision
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: vision
      MINIO_SECRET_KEY: vision-secret
      MINIO_BUCKET: documents
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4.5}
      XAI_REASONING_EFFORT: ${XAI_REASONING_EFFORT:-low}
      # Off by default (like AUTH_MODE): a capability that spends money with no human
      # present is switched on deliberately. Set AMBIENT_ENABLED=1 to run the loop.
      AMBIENT_ENABLED: ${AMBIENT_ENABLED:-}
      AMBIENT_TICK_SECONDS: ${AMBIENT_TICK_SECONDS:-60}
      AMBIENT_MAX_RUNG: ${AMBIENT_MAX_RUNG:-1}
      AMBIENT_DELTA_K: ${AMBIENT_DELTA_K:-1.5}
      AMBIENT_BRIEF_BUDGET: ${AMBIENT_BRIEF_BUDGET:-3}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./server/app:/app/app

  shooter:
    build: ./shooter
    environment:
      WEB_URL: http://web:5173
    ports:
      - "3002:3002"
    volumes:
      # Mounted like ./server/app and ./web/src, so a renderer change only needs
      # `docker compose restart shooter` rather than an image rebuild.
      - ./shooter/index.mjs:/app/index.mjs
    depends_on:
      - web

  web:
    build: ./web
    environment:
      VITE_API_PROXY: http://server:3001
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html

volumes:
  pgdata:
  miniodata:
